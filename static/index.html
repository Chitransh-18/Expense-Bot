<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ExpenseTracker Pro - Installable Web App</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/png" href="https://img.icons8.com/color/192/wallet--v1.png" />
  
  <!-- CSS Design System -->
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div class="app-container">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div>
        <div class="brand">
          <div class="brand-icon">💰</div>
          <span>ExpenseTracker</span>
        </div>

        <div id="cloud-sync-badge" style="display: none; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: var(--cyan); background: rgba(6, 182, 212, 0.12); border: 1px solid rgba(6, 182, 212, 0.25); border-radius: 20px; padding: 0.3rem 0.75rem; margin: 0.8rem 0 1.2rem 0; width: fit-content;">
          🟢 <span style="font-size: 0.78rem; opacity: 0.95;">Cloud Synced</span>
        </div>

        <ul class="nav-menu">
          <li class="nav-item active" onclick="window.location.hash='#dashboard'">
            <span style="font-size: 1.2rem;">📊</span>
            <span>Dashboard</span>
          </li>
          <li class="nav-item" onclick="window.location.hash='#expenses'">
            <span style="font-size: 1.2rem;">💰</span>
            <span>Expenses</span>
          </li>
          <li class="nav-item" onclick="window.location.hash='#recurring'">
            <span style="font-size: 1.2rem;">📅</span>
            <span>Recurring Bills</span>
          </li>
        </ul>
      </div>

      <div class="user-profile-sidebar" style="display: flex; flex-direction: column; gap: 0.8rem;">
        <button class="btn btn-secondary btn-sm" id="btn-install-app" style="display: none;" onclick="triggerInstallApp()">
          📱 Install App
        </button>
        <button class="btn btn-secondary btn-sm" onclick="App.openInstallHelpModal()">
          📲 Mobile Install Guide
        </button>
        <button class="btn btn-secondary btn-sm" onclick="App.logout()">
          🚪 Sign Out
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <div id="view-container">
        <!-- Views dynamically injected here via router -->
      </div>
    </main>

  </div>

  <!-- Universal Reusable Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title" style="font-size: 1.2rem; font-weight: 700;">Modal Title</h3>
        <button onclick="App.closeModal()" style="background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer;">&times;</button>
      </div>
      <div id="modal-body">
        <!-- Modal Form Content -->
      </div>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="/js/api.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/reminders.js"></script>
  <script src="/js/recurring.js"></script>
  <script src="/js/expenses.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
